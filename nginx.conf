# The status page's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. On a status page that is worse than anywhere else: an uptime check
# pointed at a mistyped URL would call this page healthy, a crawler would index a page that does
# not exist, and a deploy that dropped a route would look exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. test/routes.test.ts
# reads THIS FILE and fails if they do not.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it. The
# Dockerfile installs this file at /etc/nginx/conf.d/default.conf, and conf.d is included FROM http
# — so a map is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces (surfaces.ts:1065-1071), and
# test/sitemap.test.ts reads that export and fails if this alternation has drifted from it. They are
# the words that name an environment rather than a surface: `surfaces.ts` reserves them so that no
# surface may take one as a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# ── AND WHY A STATUS PAGE IN PARTICULAR MUST NOT BE INDEXED OFF MAINNET ────────────────────────
#
# The mainnet page below is deliberately indexable, which is unusual in this estate and argued at
# length in index.html. That makes the non-mainnet case WORSE here than on the marketing site
# rather than merely equivalent: a testnet status page is a page that answers the question "is
# CloudsForge up?" about an estate of deliberately broken services. Indexed beside the real one, it
# is a confident wrong answer to the one question this surface exists to answer, delivered by a
# source the reader trusts. So a non-mainnet environment answers `Disallow: /` and serves no
# sitemap, and there is no shape of that decision worth softening.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`status-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this surface
# at the two-label `status.testnet.<apex>` — unreachable, because Cloudflare's Universal SSL is a
# one-label wildcard and every two-label name fails the handshake at the edge). `surfaces.ts` keeps
# the old shape deliberately, so both have to match or half the estate stays indexable on testnet.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh. A status page
    # link is pasted into chat threads and pinned in tabs, so deep links are the normal case here
    # rather than the exception.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what this block did in the template until it was fixed, stripping
        # nosniff from every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists — and on this page, a cached shell is
    # also how somebody ends up reading last week's status during this week's outage.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts asserts it.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(history|about)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate all four.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from the apex (test/no-build-time-config.test.ts).
    # That rule bites harder here than anywhere: this is the image that must be servable from a
    # static mirror put up BECAUSE the primary is down, and a hostname frozen into it is what stops
    # that working. nginx is the component that knows: it has `$host` on every request, so the
    # addresses are composed per request and the artefact stays environment-free.
    #
    # A file in public/ would be worse than either alternative. `location = /robots.txt` wins over
    # the `location /` prefix that serves the static tree, so the file would be built, deployed,
    # unreachable, and edited by the next reader to no effect. test/sitemap.test.ts asserts neither
    # file exists.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ──────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `status.<apex>`, so the same generator would emit
    # `hub.status.<apex>` — a two-label hostname that resolves to nothing and fails the edge's
    # one-label wildcard certificate. A sitemap of addresses that cannot be connected to is worse
    # than no sitemap: a crawler handed dead URLs by a site's own index discounts the ones that
    # work. So this surface lists ITS OWN three routes and nothing else, and the estate sitemap
    # stays the apex's job — `SITEMAP_SURFACES` (ui/packages/ui/src/sitemap.ts:47-49) already
    # includes `status` there, because this surface carries `servesUi: true` and no `adminOnly`.
    #
    # There is no fourth entry to argue about. This app has exactly three addresses and a
    # catch-all; `ROUTES` in src/lib/routes.ts is the list, and test/sitemap.test.ts derives the
    # expectation from that export rather than from a copy of this block.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # REPEATED, for the reason `location = /` above already records: a location that declares
        # ANY add_header inherits NONE from the level above, and this block declares Cache-Control.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/history</loc></url>
  <url><loc>$scheme://$host/about</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole. See the map above the server
        # block for why that is a stronger position on a status page than on a marketing site.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        # `Allow: /`, WHICH IS THE UNUSUAL HALF. Three of the four surfaces in this batch answer
        # `Disallow: /` because they are `adminOnly` operator consoles. This one is derived the
        # other way by `robotsDirective()` (ui/packages/ui/src/seo.ts:139-142) from a registry row
        # that carries `servesUi: true` and no `adminOnly` (surfaces.ts:672-687), and that is
        # correct rather than an oversight: a public status page whose only job is to be reachable
        # when the platform is not has to be findable by somebody who is NOT already holding the
        # link. The snapshot refusal that keeps its sentences out of the result itself is the meta
        # tag's job, not this file's — see index.html.
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon) is served; anything else 404s, and the error page below turns that 404
    # into the app shell WITHOUT changing the status. robots.txt and sitemap.xml are NOT files and
    # never reach here: the two exact-match locations above take precedence over this prefix.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe.
    #
    # It answers before the app has been fetched, so it says the SERVER is up — never that the
    # page can determine status. That distinction matters more here than anywhere: this container
    # being healthy while Beacon is unreachable is precisely the case the page is built to report
    # honestly, and a probe that conflated the two would hide it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
